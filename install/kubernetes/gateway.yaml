# 添加代理8080端口的gateway，需要在istio-ingressgateway 的相关配置中打开8080端口
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: kubeflow-gateway
  namespace: kubeflow
spec:
  selector:
    istio: ingress
  servers:
  - hosts:
    - '*'         # 如果使用域名为平台接入，这里要改成域名，并重新部署这个文件
    port:
      name: http
      # number: 80 # isito-ingress容器默认参数不支持暴露80,443等低端口，手动修改gateway配置后，对应ingress SVC的targetPort配置也需要配套修改
      number: 8080      protocol: HTTP       # TCP 协议需要vs tcp match 端口后才会开启

